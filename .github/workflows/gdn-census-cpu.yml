name: GDN failure census CPU checks
on:
  push:
    branches: [exp/gdn-long-context-failure-census-20261028]
    paths: ["new/gdn_failure_census/**", ".github/workflows/gdn-census-cpu.yml"]
  pull_request:
    paths: ["new/gdn_failure_census/**", ".github/workflows/gdn-census-cpu.yml"]
jobs:
  unit:
    name: Data, statistics, resume, merge and controlled operator checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU numerical dependency
        run: python -m pip install 'numpy>=1.24,<3'
      - name: Unit tests (no model downloads)
        working-directory: new/gdn_failure_census
        run: python -m unittest discover -s tests -v
      - name: Shell syntax
        run: bash -n new/gdn_failure_census/run_h100.sh
