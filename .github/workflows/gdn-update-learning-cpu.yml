name: GDN update learning CPU checks
on:
  push:
    branches: [exp/gdn-update-learning-20261030]
    paths: ['new/gdn_update_training/**', '.github/workflows/gdn-update-learning-cpu.yml']
  pull_request:
    paths: ['new/gdn_update_training/**', '.github/workflows/gdn-update-learning-cpu.yml']
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest numpy
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - name: New package tests (no weights or CUDA)
        run: python -m pytest -q new/gdn_update_training/tests
      - name: Existing census regression suite
        working-directory: new/gdn_failure_census
        run: python -m unittest discover -s tests -v
      - name: Shell and Python syntax
        run: |
          bash -n new/gdn_update_training/run.sh
          python -m compileall -q new/gdn_update_training
