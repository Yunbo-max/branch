[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "branch-memory-prototype"
version = "0.2.0"
description = "Inspectable historical-parent memory research prototype; not official MARCH"
requires-python = ">=3.10"
dependencies = ["torch>=2.2"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["branch_memory*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
