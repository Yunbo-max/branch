[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "predictive-state-drafter"
version = "0.1.0"
description = "Reference recurrent GDN predictive drafter with teacher-anchored OPD"
requires-python = ">=3.10"
dependencies = ["torch>=2.4"]

[project.optional-dependencies]
train = ["transformers==5.16.1", "safetensors>=0.5"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["psdraft*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
